name: Verify Axiom integration

on:
  pull_request:
    paths: ['apps/axiom/**', 'supabase/**', '.github/workflows/axiom-ci.yml']
  push:
    branches: [main]
    paths: ['apps/axiom/**', 'supabase/**', '.github/workflows/axiom-ci.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/axiom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/axiom/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check backend
      - run: python -m pytest -q
      - run: docker compose --profile dashboard config --quiet
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/axiom/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/axiom/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
